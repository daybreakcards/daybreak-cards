<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events · Daybreak Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
  <a href="index.html" class="logo-link"><img src="assets/logo-primary-navy.svg" alt="Daybreak Cards" class="header-logo" /></a>
  <div class="icon-btn" id="darkToggle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></div>
</div>

<nav class="page-nav">
  <a href="index.html">Home</a>
  <a href="inventory.html">Inventory</a>
  <a href="events.html" class="active">Events</a>
  <a href="about.html">About</a>
  <a href="faq.html">FAQ</a>
  <a href="sell.html">Sell to us</a>
  <a href="wanted.html">Wanted</a>
</nav>

<div class="wrap">
  <div class="subpage show" style="max-width:640px;">
    <div class="event-hero">
      <div class="show-eyebrow" style="color:var(--red-2);">NEXT SHOW</div>
      <div class="event-hero-title">Hobby Hangout XL</div>
      <div class="event-hero-days">
        <div class="event-hero-day"><span>Sat, November 14</span><span>10 AM – 6 PM</span></div>
      </div>
      <div class="event-hero-venue">Carriageworks</div>
      <div class="event-hero-address">245 Wilson St, Eveleigh NSW 2015, Australia</div>
      <a class="submit-btn" href="#" style="display:inline-block;text-decoration:none;text-align:center;width:auto;padding:12px 26px;margin-top:16px;">Get tickets</a>
    </div>

    <div class="subpage-head" style="margin-top:40px;">
      <div class="subpage-title" style="font-size:20px;">Full schedule</div>
    </div>
    <div class="event-list">
      <div class="event-row">
        <div class="event-date"><div class="day">14</div><div class="month">Nov</div></div>
        <div><div class="event-name">Hobby Hangout XL</div><div class="event-loc">Carriageworks, Sydney</div></div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('darkToggle').addEventListener('click', () => document.body.classList.toggle('dark'));

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuDrawer').classList.add('show');
  document.getElementById('menuOverlay').classList.add('show');
});
document.getElementById('menuClose').addEventListener('click', closeMenu);
document.getElementById('menuOverlay').addEventListener('click', closeMenu);
function closeMenu(){
  document.getElementById('menuDrawer').classList.remove('show');
  document.getElementById('menuOverlay').classList.remove('show');
}

</script>

<div class="cart-overlay" id="menuOverlay"></div>
<div class="cart-drawer" id="menuDrawer">
  <div class="cart-head">
    <div class="cart-title">Menu</div>
    <button class="cart-close" id="menuClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="cart-items">
    <a href="index.html" class="menu-link">Home</a>
    <a href="inventory.html" class="menu-link">Inventory</a>
    <a href="events.html" class="menu-link">Events</a>
    <a href="about.html" class="menu-link">About</a>
    <a href="faq.html" class="menu-link">FAQ</a>
    <a href="sell.html" class="menu-link">Sell to us</a>
    <a href="wanted.html" class="menu-link">Wanted</a>
  </div>
</div>
</body>
</html>
